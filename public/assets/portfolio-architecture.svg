<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <!-- Background -->
  <rect width="1000" height="560" fill="#f7f9f7" rx="6"/>

  <!-- Title -->
  <text x="50" y="52" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#101612">Portfolio Deployment Architecture</text>
  <text x="50" y="76" font-family="Arial, sans-serif" font-size="12" fill="#5d6b62">Planned production path: GitHub → Actions → Docker → ECR → EC2 → Nginx → HTTPS</text>

  <!-- Divider -->
  <line x1="50" y1="90" x2="950" y2="90" stroke="#d4e0d8" stroke-width="1"/>

  <!-- ── ROW 1: GitHub → Actions → ECR → EC2 ── -->

  <!-- Arrow: GitHub → Actions -->
  <line x1="195" y1="210" x2="255" y2="210" stroke="#1b6f43" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- Arrow: Actions → ECR -->
  <line x1="415" y1="210" x2="475" y2="210" stroke="#1b6f43" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- Arrow: ECR → EC2 -->
  <line x1="635" y1="210" x2="695" y2="210" stroke="#1b6f43" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Box: GitHub -->
  <rect x="55" y="165" width="140" height="90" rx="8" fill="#e6f5ec" stroke="#1b6f43" stroke-width="1.8"/>
  <text x="125" y="201" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#101612" text-anchor="middle">GitHub</text>
  <text x="125" y="220" font-family="Arial, sans-serif" font-size="11" fill="#3d5248" text-anchor="middle">Source Control</text>
  <text x="125" y="238" font-family="Arial, sans-serif" font-size="10" fill="#7a8e83" text-anchor="middle">push → main</text>

  <!-- Box: GitHub Actions -->
  <rect x="255" y="165" width="160" height="90" rx="8" fill="#e6f5ec" stroke="#1b6f43" stroke-width="1.8"/>
  <text x="335" y="201" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#101612" text-anchor="middle">GitHub Actions</text>
  <text x="335" y="220" font-family="Arial, sans-serif" font-size="11" fill="#3d5248" text-anchor="middle">CI / CD Pipeline</text>
  <text x="335" y="238" font-family="Arial, sans-serif" font-size="10" fill="#7a8e83" text-anchor="middle">build · test · docker push</text>

  <!-- Box: Amazon ECR -->
  <rect x="475" y="165" width="160" height="90" rx="8" fill="#e6f5ec" stroke="#1b6f43" stroke-width="1.8"/>
  <text x="555" y="201" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#101612" text-anchor="middle">Amazon ECR</text>
  <text x="555" y="220" font-family="Arial, sans-serif" font-size="11" fill="#3d5248" text-anchor="middle">Image Registry</text>
  <text x="555" y="238" font-family="Arial, sans-serif" font-size="10" fill="#7a8e83" text-anchor="middle">versioned docker images</text>

  <!-- Box: AWS EC2 -->
  <rect x="695" y="145" width="185" height="130" rx="8" fill="#daf0e6" stroke="#1b6f43" stroke-width="2.2"/>
  <text x="787" y="183" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#101612" text-anchor="middle">AWS EC2</text>
  <text x="787" y="202" font-family="Arial, sans-serif" font-size="11" fill="#3d5248" text-anchor="middle">Docker Container</text>
  <line x1="710" y1="215" x2="865" y2="215" stroke="#1b6f43" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="787" y="232" font-family="Arial, sans-serif" font-size="10" fill="#3d5248" text-anchor="middle">Nginx (reverse proxy)</text>
  <text x="787" y="249" font-family="Arial, sans-serif" font-size="10" fill="#7a8e83" text-anchor="middle">port 80 / 443</text>
  <text x="787" y="265" font-family="Arial, sans-serif" font-size="10" fill="#7a8e83" text-anchor="middle">static asset serving</text>

  <!-- ── Vertical arrow EC2 → HTTPS ── -->
  <line x1="787" y1="277" x2="787" y2="337" stroke="#1b6f43" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Box: HTTPS / Portfolio (dark) -->
  <rect x="695" y="337" width="185" height="90" rx="8" fill="#101612" stroke="#54e38e" stroke-width="2"/>
  <text x="787" y="373" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#54e38e" text-anchor="middle">HTTPS</text>
  <text x="787" y="394" font-family="Arial, sans-serif" font-size="11" fill="#d7e0da" text-anchor="middle">Public Portfolio</text>
  <text x="787" y="412" font-family="Arial, sans-serif" font-size="10" fill="#7eac91" text-anchor="middle">SSL · CDN-ready</text>

  <!-- ── Legend / Steps strip ── -->
  <rect x="50" y="460" width="900" height="72" rx="6" fill="#eef5f0" stroke="#c8dbd0" stroke-width="1"/>
  <text x="70" y="481" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#1b6f43">DEPLOYMENT STEPS</text>

  <!-- Step badges -->
  <rect x="70" y="490" width="16" height="16" rx="3" fill="#1b6f43"/>
  <text x="78" y="502" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="91" y="502" font-family="Arial, sans-serif" font-size="10" fill="#3d5248">git push → main</text>

  <rect x="200" y="490" width="16" height="16" rx="3" fill="#1b6f43"/>
  <text x="208" y="502" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="221" y="502" font-family="Arial, sans-serif" font-size="10" fill="#3d5248">Actions: build + docker push</text>

  <rect x="390" y="490" width="16" height="16" rx="3" fill="#1b6f43"/>
  <text x="398" y="502" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="411" y="502" font-family="Arial, sans-serif" font-size="10" fill="#3d5248">EC2: docker pull + run</text>

  <rect x="560" y="490" width="16" height="16" rx="3" fill="#1b6f43"/>
  <text x="568" y="502" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="581" y="502" font-family="Arial, sans-serif" font-size="10" fill="#3d5248">Nginx serves static build</text>

  <rect x="730" y="490" width="16" height="16" rx="3" fill="#101612" stroke="#54e38e" stroke-width="1"/>
  <text x="738" y="502" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#54e38e" text-anchor="middle">5</text>
  <text x="751" y="502" font-family="Arial, sans-serif" font-size="10" fill="#3d5248">HTTPS live to users</text>

  <text x="70" y="522" font-family="Arial, sans-serif" font-size="9" fill="#8a9e91">Architecture documented as planned until deployment is configured and tested on target AWS account.</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1b6f43"/>
    </marker>
  </defs>
</svg>
