name: Build and Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t nagendra-devops-portfolio:${{ github.sha }} .

      # Deployment is intentionally not enabled until AWS account/repository/role
      # details are configured. Use GitHub OIDC rather than long-lived AWS keys.
      # Add ECR + EC2 deployment steps after infrastructure is provisioned.
