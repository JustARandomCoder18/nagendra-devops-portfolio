name: Build and Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: nagendra-devops-portfolio

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::484826611952:role/github-actions-portfolio-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            .

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to EC2
        run: |
          aws ssm send-command \
            --region ${{ env.AWS_REGION }} \
            --instance-ids i-026cda1219a03afe1 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "echo Logging in to ECR...",
              "aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin 484826611952.dkr.ecr.us-east-1.amazonaws.com",
              "echo Pulling new portfolio image...",
              "sudo docker pull 484826611952.dkr.ecr.us-east-1.amazonaws.com/nagendra-devops-portfolio:${{ github.sha }}",
              "echo Stopping old container...",
              "sudo docker stop nagendra-devops-portfolio || true",
              "sudo docker rm nagendra-devops-portfolio || true",
              "echo Starting new container...",
              "sudo docker run -d --name nagendra-devops-portfolio --restart unless-stopped -p 8080:80 484826611952.dkr.ecr.us-east-1.amazonaws.com/nagendra-devops-portfolio:${{ github.sha }}",
              "echo Cleaning unused Docker images...",
              "sudo docker image prune -af",
              "echo Deployment completed successfully!"
            ]'